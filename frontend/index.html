<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCOS Smart Assistant</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Newsreader:opsz,wght@16..72,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #2dd4bf;
            --accent: #f472b6;
            --bg: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            font-family: 'Manrope', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        /* Netflix-style zoom out background */
        .background-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.15), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.05), transparent 50%);
            z-index: 1;
            animation: bgZoom 5s ease-out forwards;
        }

        @keyframes bgZoom {
            from { transform: scale(1.1); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .splash-content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Large Logo Animation */
        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.3));
        }

        .logo-main {
            font-size: 5rem;
            animation: logoEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: block;
        }

        .logo-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: ringPulse 2s ease-out infinite 0.8s;
        }

        @keyframes logoEntrance {
            0% { transform: scale(0.6); opacity: 0; filter: blur(10px); }
            50% { opacity: 1; filter: blur(0px); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes ringPulse {
            0% { width: 80%; height: 80%; opacity: 0.6; }
            100% { width: 150%; height: 150%; opacity: 0; }
        }

        .app-name {
            font-family: 'Newsreader', serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(120deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards 0.4s;
        }

        .tagline {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards 0.6s;
        }

        /* Modern thin loading bar */
        .loading-bar-container {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 40px;
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards 0.8s;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 10px var(--primary);
            animation: loadProgress 2s cubic-bezier(0.1, 0, 0.1, 1) forwards 0.8s;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Screen out transition */
        .exit-transition {
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="background-shimmer"></div>
    
    <div class="splash-content" id="splash">
        <div class="logo-container">
            <span class="logo-main" role="img" aria-label="Medical Icon"><i class="fas fa-hospital" aria-hidden="true" style="margin-right: 8px;"></i></span>
            <div class="logo-ring"></div>
        </div>
        
        <h1 class="app-name">PCOS Smart Assistant</h1>
        <p class="tagline">Intelligent Health Journey</p>
        
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        // Professional deliberate delay to allow animations to be appreciated
        window.addEventListener('load', () => {
            const minDisplayTime = 2200; // 2.2 seconds for full effect
            const startTime = Date.now();

            function navigate() {
                const splash = document.getElementById('splash');
                splash.classList.add('exit-transition');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }

            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, minDisplayTime - elapsed);
            
            setTimeout(navigate, remaining);
        });

        // Backup safety redirect
        setTimeout(() => {
            if (window.location.href.includes('index.html')) {
                window.location.href = 'dashboard.html';
            }
        }, 5000);
    </script>
</body>

</html>
